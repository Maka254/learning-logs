{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
  <h2>Register a new account:</h2>
{% endblock page_header %}

{% block content %}
  <div class="card mb-3 shadow-sm" style="max-width: 500px;">
    <div class="card-body">
      <form method="post" action="{% url 'users:register' %}" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% bootstrap_button button_type="submit" content="Register" %}
        
      </form>
  
{% endblock content %}
